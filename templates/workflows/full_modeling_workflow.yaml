workflow_name: full_modeling_workflow
description: Full v0.7.x target chain from data templates to reports and user manuals.
dry_run_default: true
stages:
  - stage_id: workspace
    enabled: true
    status: available
    notes: Create a manifest-backed workspace with immutable raw uploads.
  - stage_id: data_center
    enabled: true
    status: partial
    notes: Upload, inspect, map, and quality-check project data.
  - stage_id: data_acquisition
    enabled: true
    status: partial
    notes: External connector plans are dry-run by default.
  - stage_id: data_standardization
    enabled: true
    status: partial
    notes: Standardized copies only; raw uploads remain unchanged.
  - stage_id: model_input_build
    enabled: true
    status: partial
    notes: Build inputs only from standardized or derived data.
  - stage_id: data_templates
    enabled: true
    status: available
    notes: Prepare and validate standard input templates.
  - stage_id: qgis_preprocessing
    enabled: true
    status: partial
    notes: QGIS/GeoJSON file bridge MVP; not a full QGIS plugin.
  - stage_id: watershed_delineation
    enabled: false
    status: partial
    notes: Small DEM diagnostics and explicitly marked fallback outputs; professional GIS review required.
  - stage_id: gee_inputs
    enabled: true
    status: partial
    notes: Requires user Earth Engine authentication for real data.
  - stage_id: hydrolite_simulation
    enabled: true
    status: available
    notes: Existing SCS-CN, unit hydrograph, Muskingum workflow.
  - stage_id: hydrologic_balance_audit
    enabled: false
    status: partial
    notes: Full-hydrograph volume audit; flood forecast remains planned until all gates pass.
  - stage_id: hec_hms_project
    enabled: false
    status: partial
    notes: Generates an unverified HEC-HMS project skeleton for manual review; no real simulation.
  - stage_id: hec_hms_run
    enabled: false
    status: partial
    notes: Default dry-run, timeout-bounded CLI probe, optional execute, and basic output summaries; DSS deep reading remains planned.
  - stage_id: swmm_coupling
    enabled: true
    status: partial
    notes: Existing graceful SWMM coupling and fallback.
  - stage_id: icesat2_water_depth
    enabled: false
    status: partial
    notes: Local/synthetic along-track water-depth constraints only; no complete bathymetry.
  - stage_id: rusle_erosion
    enabled: false
    status: partial
    notes: Annual average sheet/rill erosion MVP, not sediment delivery.
  - stage_id: conservation_scenario
    enabled: false
    status: partial
    notes: Single-event runoff difference and soil-conservation scenario.
  - stage_id: reservoir_routing
    enabled: false
    status: partial
    notes: Explicit level-pool routing requires stage-storage and discharge curves; no inferred free outflow.
  - stage_id: sediment_delivery
    enabled: false
    status: partial
    notes: RUSLE-to-SDR hillslope delivery MVP; missing gully, bank, and channel processes stay missing.
  - stage_id: watershed_accounting
    enabled: false
    status: partial
    notes: Explicit partial completeness audit; missing components are not zero.
  - stage_id: flood_forecast
    enabled: false
    status: partial
    notes: Scenario/hindcast HydroLite ensemble MVP; optional local HEC-HMS and ML, HEC-HMS Reservoir blocked, not operationally validated.
  - stage_id: drought_forecast
    enabled: false
    status: planned
    notes: Planned lightweight drought indicators.
  - stage_id: calibration
    enabled: false
    status: planned
    notes: Planned parameter scan, not complex optimization.
  - stage_id: comparison
    enabled: true
    status: available
    notes: Existing scenario comparison.
  - stage_id: report_export
    enabled: true
    status: available
    notes: Existing report export.
  - stage_id: user_manual_export
    enabled: false
    status: planned
    notes: Planned Chinese/English manual export.

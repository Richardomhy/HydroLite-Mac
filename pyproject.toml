[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrolite-mac"
version = "0.7.0.dev0"
description = "HydroLite Studio: a project-centered lightweight hydrologic and hydraulic modeling workbench."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "python-docx>=1.1",
  "pyswmm>=2.1",
  "PyYAML>=6.0",
  "streamlit>=1.58",
  "swmm-toolkit>=0.16.2",
  "swmm_api>=0.4.73",
]

[project.optional-dependencies]
desktop = [
  "psutil>=5.9",
]
desktop-build = [
  "pyinstaller>=6.10",
]
desktop-update = [
  "packaging>=24",
]
dev = [
  "pytest>=8.0",
]
ml = [
  "joblib>=1.3",
  "scikit-learn>=1.4",
]
deep-learning = [
  "torch>=2.2",
]
data = [
  "charset-normalizer>=3",
  "openpyxl>=3.1",
  "python-dateutil>=2.8",
]
gis = [
  "geopandas>=0.14",
  "pyproj>=3",
  "rasterio>=1.3",
  "shapely>=2",
]
connectors = [
  "earthengine-api>=1",
  "fsspec>=2024",
  "pystac-client>=0.8",
]
nasa = [
  "earthaccess>=0.10",
  "h5py>=3.11",
]
copernicus = [
  "cdsapi>=0.7",
  "netCDF4>=1.7",
  "xarray>=2024",
]
all-data = [
  "cdsapi>=0.7",
  "earthaccess>=0.10",
  "earthengine-api>=1",
  "fsspec>=2024",
  "geopandas>=0.14",
  "h5py>=3.11",
  "netCDF4>=1.7",
  "pystac-client>=0.8",
  "rasterio>=1.3",
  "xarray>=2024",
]
science = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "xarray>=2024",
  "netCDF4>=1.7",
  "h5py>=3.11",
  "cftime>=1.6",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyproj>=3",
  "shapely>=2",
  "fsspec>=2024",
]
drought = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]
drought-ml = [
  "joblib>=1.3",
  "scikit-learn>=1.4",
]
climate-connectors = [
  "cdsapi>=0.7",
  "earthaccess>=0.10",
  "fsspec>=2024",
  "pystac-client>=0.8",
]

[tool.setuptools.packages.find]
include = ["hydrolite*"]

canonical_uri: gs://earthengine-stac/catalog/catalog.json
bucket_uri: gs://earthengine-stac
legacy_root_candidate: gs://earthengine-stac/catalog.json
legacy_https_candidate:
  uri: https://storage.googleapis.com/earthengine-stac/catalog.json
  status: unverified_transport_candidate
catalog_completeness: fixture_only
allowed_hosts:
  - storage.googleapis.com
  - developers.google.com
refresh_default: dry-run
allow_fixture_fallback: true
transport_priority:
  - google_cloud_storage_anonymous
  - google_cloud_storage_authenticated
  - gcloud_storage
  - gsutil
  - verified_https
parser_version: "1"
limits:
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  max_concurrency: 4
  max_retries_per_url: 2
  max_depth: 20
  max_documents: 20000
  max_records: 10000
  max_metadata_bytes: 5242880
  required_field_pass_rate: 0.95
  max_failure_rate: 0.05

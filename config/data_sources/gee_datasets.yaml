use_case_rules:
  watershed_delineation: {preferred_characteristics: [dem, elevation], fallback_characteristics: [global_dem], preprocessing_notes: ["check projection and sinks"]}
  event_hydrology: {preferred_characteristics: [precipitation], fallback_characteristics: [daily_precipitation], preprocessing_notes: ["align rainfall interval"]}
  continuous_hydrology: {preferred_characteristics: [precipitation, soil moisture], fallback_characteristics: [daily_forcing], preprocessing_notes: ["check temporal coverage"]}
  flood_forecast: {preferred_characteristics: [precipitation, dem], fallback_characteristics: [rainfall], preprocessing_notes: ["catalog metadata is not a forecast feed"]}
  drought_forecast: {preferred_characteristics: [precipitation, soil moisture], fallback_characteristics: [surface water], preprocessing_notes: ["check historical coverage"]}
  evapotranspiration: {preferred_characteristics: [evapotranspiration, temperature], fallback_characteristics: [temperature], preprocessing_notes: ["confirm units"]}
  soil_moisture: {preferred_characteristics: [soil moisture], fallback_characteristics: [precipitation], preprocessing_notes: ["confirm depth"]}
  reservoir_waterbody: {preferred_characteristics: [surface water], fallback_characteristics: [dem], preprocessing_notes: ["validate footprint"]}
  rusle: {preferred_characteristics: [dem, vegetation, land cover], fallback_characteristics: [precipitation], preprocessing_notes: ["not an outlet sediment estimate"]}
  vegetation: {preferred_characteristics: [vegetation], fallback_characteristics: [land cover], preprocessing_notes: ["check cloud and compositing"]}
  future_water_quality_inputs: {preferred_characteristics: [surface water, precipitation], fallback_characteristics: [temperature], preprocessing_notes: ["water_quality remains planned"]}
